# dsh-host-tool-layering 的包内 patch（组合包 bundle patch）。
# 本包随 profile 的 dsh.profile.bundles 加载时，由 loader 应用本文件。
# 启停：插件页「已安装」里本卡的总开关(写 bundles)，或卡片详情里的行级开关
# (向 profile 的 cordis.patch.yml 写 disabled 覆盖)。
# 行 id `tool-layering` 是上述开关与 settings 命名空间的寻址键，勿改。
#
# ── 它是干什么的 ───────────────────────────────────────────────────────────
# 在 system prompt 组装的 system-prompt/assemble 水线上，**不做任何工作区检测**，
# 把配置里各组前缀下的工具从"模型可见工具表"里摘掉，并逐组计数。
# 唯一的运行时输入是"本会话放行了哪些组"(见下面的「常驻入口工具」)：
# 未放行的组 ⇒ 照旧摘；已放行的组 ⇒ 那一组一个工具都不摘（其它组不受影响）。
# 组表就在下面 config.groups 里：每组 = 一批工具的前缀(prefix) + 一个说明技能(skill)
# + 一个自己的入口工具名(entryName)。
# 默认两组(2026-10-04 实测的常驻成本):
#   · cua   —— cua_driver_native__ 前缀 56 个工具 / 24,832 wire token → 技能 computer-control
#   · godot —— mcp__godot_use__    前缀 39 个工具 /  9,599 wire token → 技能 godot-use
# 两组合计 34,431 token，占模型可见工具表 88 个 / 32,024 token（旧基线）的绝大部分。
#
# ── 常驻入口工具(每组一个；v0.2.0 引入，v0.3.0 改成按组独立) ────────────────
# 每个组各有一个**常驻可见**的工具，名字 = 该组的 entryName(缺省 `get_<组名>`，
# 默认两组即 `get_cua` / `get_godot`)。模型调用**某一个**入口一次，**该会话**从**下一步**起
# 只放行**那一组**，别的组照旧被摘（判定粒度是 `(会话, 组)`，进程内登记，直到宿主重启）。
# 一步时延是设计使然 —— 装配发生在每一步开始，而工具调用发生在步中。
# 为什么需要它：摘掉宣布面之后模型看不见这组工具的任何痕迹，只能靠技能当说明书"凭记忆按
# 完整名硬发" —— 真机上因此失败过一次(session-aaaa1111… 里 325 次工具调用，CUA 零次；
# 复盘见工作区笔记 `.dsh\.project\dsh-工具面按需暴露-20261005.md` §1)。
# ⚠ 入口工具是**会话级 + 按组**的：只有被点开的那一组会回来。调用幂等(重复调用不改变任何
#   东西)，也没有"取消放行"这个语义 —— 要收回只能等宿主重启。
# ⚠ entryName 必须是 1–64 位 ASCII 工具名(只允许字母/数字/下划线/连字符)，不能用保留名
#   `run_code`(PTC 呈现通道，注册会抛)，**也不能以任何一组的 prefix 开头**(那样本插件会把
#   自己的入口工具也摘掉)，**各组的 entryName 之间也不能重名**(重名 ⇒ 只有一个注册生效，
#   另一组永远放不出来)；写错任一条 ⇒ 配置非法 ⇒ 整个插件不生效(见「失效语义」)。
# ⚠ 工具描述只说"能拿到什么"(一句话英文，≤120 字符)：它是每步都要付的常驻 token，
#   机制解释一律留在 README，不放进工具定义。
#
# ── 组语义(逐条) ──────────────────────────────────────────────────────────
# · name      仅用于日志点名(`present=56 removed=56 (cua)` 里的 cua)与放行判定；
#             不写则由 prefix 推出(`mcp__godot_use__` → godot，`cua_driver_native__` → cua)。
# · prefix    该组工具名的公共前缀，是**唯一**的识别依据。空前缀是非法配置 ——
#             `''.startsWith('')` 恒真，会把所有工具都摘掉。
# · skill     说明技能名(目录名)，装配时校验 `~\.dsh\skills\<skill>\SKILL.md` 是否存在
#             (结果按技能名缓存，进程内只 stat 一次)。不存在就打一条 warn 点名 ——
#             **工具摘了却没有说明书，模型对该能力彻底失明**，这条必须 fail-loud。
#             没配 skill 也是合法的，但挂载时会 warn 一次(同一件事的另一半)。
# · entryName 该组**自己的**常驻入口工具名；不写则缺省 `get_<组名>`。模型调用它 ⇒
#             该会话从下一步起只放行这一组。形态/保留名/前缀/重名四条校验见上。
#             顶层已经**没有** entryName 这个键了(v0.2.0 有)：现在写顶层只会得到一条
#             "不认得的键，已忽略"的 warn。
# · 前缀重叠时**长的先匹配**，每个工具恰好算给一组 ⇒ 逐组计数不会重复计。
# · groups 写成空数组 `[]` 是**合法**配置 ⇒ 不注册水线、一个工具都不摘(静默 no-op)，
#   也**不注册任何入口工具**(没有组就没有"放回"这回事)；
#   ⚠ 想全关请写 `groups: []`，别写成空值 `groups:`(YAML 空值得到 null，按"未设置"处理 ⇒ 用默认两组)。
#
# ── 与 dsh-host-godot-tool-layering 的关系 ────────────────────────────────
# 本插件是那份插件 v0.2.0 的**泛化**：那边把"一个 godot 前缀 + 一个 godot-use 技能"编在
# 代码里，这边抽成配置面的一张组表。godot 那一组的语义与它完全等价(同样是"不做检测、
# 任何会话一律全摘")。两者**同时启用不会冲突**(摘除是幂等的，谁先摘另一个看到 present=0),
# 但同时启用没有意义：建议本插件生效后停用旧插件(见 README §11)。
#
# ── 边界(重要) ────────────────────────────────────────────────────────────
# 摘的是**宣布面**(模型看不看得见)，**不是能力边界** —— 按完整名调用仍会成功执行
# (执行解析走 dsh-tools 注册表视图，从不读装配体)；PTC/both 模式下 run_code 内仍可调
# 全部工具(那走 sdkSchemas)。要真边界请另用官方 tools.restrict({deny})。详见 README「能力边界」。
# 入口工具同样**不是**权限开关：它只是把宣布面放回来，不放宽任何执行限制。
#
# ── 失效语义 ──────────────────────────────────────────────────────────────
# · 配置非法(config 非对象 / diag 非布尔 / groups 非数组 / 组项缺 prefix / prefix 非字符串或空串 /
#   组内 entryName 形态非法、用保留名 run_code、以任一组 prefix 开头、或与别组入口名重名)
#   ⇒ 只打一条 error 并且不注册水线(插件不生效)。**不抛错** ⇒ 不影响宿主启动，
#   0.1.7-rc.1 起 loader 1.0.5 已取消事务回滚，也不会连带同层其它 insert 行。
#   ⚠ 这种形态下**一个工具都不会摘 ⇒ 也不注册任何入口工具**：不存在"摘了却没有入口"的死角。
# · 某组工具在场却零命中该组前缀 ⇒ 该组打一条 warn(fail-loud，每组只打一次)：
#   防上游改 serverName / 前缀写错之后"插件看着在跑、实际白装"。
#   (本插件自己的入口工具已全部从这条启发式里排除：`get_cua` / `get_godot` 里分别含
#   关键词 `cua` / `godot`，不排除会误报。)
# · 某组真的摘了工具、但它配的 SKILL.md 不存在 ⇒ 打一条 warn 点名缺失路径(每个技能只打一次)。
# · 不认得的键(顶层或组内)只 warn 点名后忽略：拒绝会让工具重新出现在可见工具表里，与目标相反。
#
# ── 生效 ⚠ ────────────────────────────────────────────────────────────────
# 包内本文件**不会自己触发重组合** —— dsh-hmr 只监视三个输入：profile 的 cordis.patch.yml、
# home 层 cordis.patch.yml、profile 的 package.json(dsh-hmr/lib/index.js:353-376)，
# 包内本文件不在其中。重组合会重读全部 bundle 层，所以改完本文件要有一次触发才被读入：
# 在插件页点一下本卡(或任意行级)开关，或在 profile 的 cordis.patch.yml 里保存任意一处改动。
# ⚠ 改包内 lib/*.js 仍需重启 dsh —— loader 复用已 import 的模块实例(依据见 README §9)，
# 所以流程永远是"先改代码、后改配置"，改完立刻看日志里的挂载行是不是新文案。
# ⚠ 反过来，**配置**的热替换不会清掉已放行的 `(会话, 组)`：登记表在 lib/entry.js 的模块作用域。
#
# ── 回滚 / 调整 ───────────────────────────────────────────────────────────
# · 某个会话被误放行(模型自己点开了) ⇒ 没有反悔开关：该会话到宿主重启前一直放行那一组，
#   最多多付那一组工具的常驻 token；要立刻收回只能重启 dsh。
#   好处是按组独立 ⇒ 点错 `get_cua` 不会把 godot 也一起放出来。
# · 只让某组工具重新可见 ⇒ 把那组从 groups 里删掉(或注释掉)后触发一次重组合；
#   也可以临时把该组 prefix 改成一个不会命中的值(不推荐：会多一条 fail-loud warn)。
# · 只想改某组入口工具的名字 ⇒ 改该组的 entryName(记得"不得以任何组 prefix 开头、不得与
#   别组重名"，否则配置非法)，触发一次重组合。
# · 退回"纯摘除"(不要入口工具，回到 v0.1.0 形态) ⇒ 本版**没有**配置开关：把 lib/index.js 里
#   注册入口工具那段循环去掉(或回退到 v0.1.0 的代码)，重启 dsh。只想让它别被模型看见，
#   也可以整个插件停用(见下条，但那会让工具全部可见，不等于"纯摘除")。
# · 整个插件停用 ⇒ profile 的 cordis.patch.yml 里写 `- id: tool-layering` + `disabled: true`
#   (profile 层在包层之后应用 ⇒ 覆写优先)，或用插件页里本卡/本行的开关；
# · 彻底移除 ⇒ dshpm remove dsh-host-tool-layering，再删源码目录。
# 不需要 patch-guard 守护：本插件不碰任何第三方文件(含 npx 缓存)，也不改任何宿主源码，
#   只读自己的配置，以及 `~\.dsh\skills\<skill>\SKILL.md` 的**存在性**。
- insert:
    - id: tool-layering
      name: 'dsh-host-tool-layering'
      config:
        diag: false
        groups:
          - name: cua
            prefix: 'cua_driver_native__'
            skill: computer-control
            entryName: get_cua             # 该组自己的入口工具名；缺省 get_cua；四条校验见上
          - name: godot
            prefix: 'mcp__godot_use__'
            skill: godot-use
            entryName: get_godot           # 缺省 get_godot；各组入口名不得重名
